name: Publish toolchain

on:
  workflow_dispatch:
    inputs:
      ghc:
        description: GHC version or GHCup tag
        required: true
        default: recommended
      cabal:
        description: cabal-install version or GHCup tag
        required: true
        default: recommended
      hls:
        description: HLS version or GHCup tag
        required: true
        default: recommended
      stack:
        description: Stack version or GHCup tag
        required: true
        default: recommended

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download GHCup
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://downloads.haskell.org/~ghcup/x86_64-mingw64-ghcup.exe" `
            -OutFile "$env:RUNNER_TEMP\ghcup.exe"

      - name: Restore GHCup download cache
        uses: actions/cache@v4
        with:
          path: C:\ghcup\cache
          key: ghcup-windows-${{ inputs.ghc }}-${{ inputs.cabal }}-${{ inputs.hls }}-${{ inputs.stack }}

      - name: Build portable toolchain
        shell: powershell
        run: |
          .\scripts\build-toolchain.ps1 `
            -GhcVersion '${{ inputs.ghc }}' `
            -CabalVersion '${{ inputs.cabal }}' `
            -HlsVersion '${{ inputs.hls }}' `
            -StackVersion '${{ inputs.stack }}' `
            -OutputDirectory "$env:RUNNER_TEMP\dist" `
            -Ghcup "$env:RUNNER_TEMP\ghcup.exe"

      - name: Smoke test unpacked environment
        shell: powershell
        run: .\.build\payload\Enter-PortableHaskell.ps1 -Check

      - name: Publish organization-hosted assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toolchain
          name: Portable Haskell toolchain
          body: |
            Windows x86-64 portable Haskell toolchain built from GHCup-verified upstream binaries.

            Every ZIP has a matching SHA-256 file. The installer refuses unverified archives.
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.sha256

      - name: End-to-end test the public one-line installer
        shell: powershell
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "public-installer-e2e"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          Push-Location $testRoot
          try {
            $asset = (Get-ChildItem "$env:RUNNER_TEMP\dist\portable-haskell-*.zip" | Select-Object -First 1).Name
            $env:ONE_CLICK_RUN_PORTABLE_HASKELL_SELECTED_ASSET = $asset
            $env:ONE_CLICK_RUN_PORTABLE_HASKELL_INSTALL_NAME = "e2e"
            $installer = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/init.ps1"
            Invoke-RestMethod $installer | Invoke-Expression

            $portableRoot = Join-Path $testRoot "OCR-portable-haskell-e2e"
            $enter = Join-Path $portableRoot "Enter-PortableHaskell.ps1"
            & powershell -NoProfile -ExecutionPolicy Bypass -File $enter -Check
            if ($LASTEXITCODE -ne 0) { throw "Public installation self-check failed." }

            $main = Join-Path $portableRoot "examples\hello\Main.hs"
            $hello = Join-Path $testRoot "hello.exe"
            & powershell -NoProfile -ExecutionPolicy Bypass -File $enter -Command @("ghc", $main, "-o", $hello)
            if ($LASTEXITCODE -ne 0) { throw "Hello World compilation failed." }
            $output = (& $hello).Trim()
            if ($output -ne "Hello from portable Haskell!") {
              throw "Unexpected Hello World output: $output"
            }
          } finally {
            Pop-Location
          }

