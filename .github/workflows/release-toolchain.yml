name: Publish toolchain

on:
  workflow_dispatch:
    inputs:
      ghc:
        description: Exact GHC version
        required: true
        default: 9.10.3
      cabal:
        description: Exact cabal-install version
        required: true
        default: 3.16.1.0
      hls:
        description: Exact HLS version
        required: true
        default: 2.14.0.0
      stack:
        description: Exact Stack version
        required: true
        default: 3.11.1

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download GHCup
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://downloads.haskell.org/~ghcup/x86_64-mingw64-ghcup.exe" `
            -OutFile "$env:RUNNER_TEMP\ghcup.exe"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\ghcup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "GHCUP_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Restore GHCup download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: C:\ghcup\cache
          key: ghcup-windows-${{ inputs.ghc }}-${{ inputs.cabal }}-${{ inputs.hls }}-${{ inputs.stack }}

      - name: Build portable toolchain
        shell: powershell
        run: |
          .\scripts\build-toolchain.ps1 `
            -GhcVersion '${{ inputs.ghc }}' `
            -CabalVersion '${{ inputs.cabal }}' `
            -HlsVersion '${{ inputs.hls }}' `
            -StackVersion '${{ inputs.stack }}' `
            -OutputDirectory "$env:RUNNER_TEMP\dist" `
            -Ghcup "$env:RUNNER_TEMP\ghcup.exe" `
            -GhcupSha256 "$env:GHCUP_SHA256"

      - name: Smoke test unpacked environment
        shell: powershell
        run: .\.build\payload\Enter-PortableHaskell.ps1 -Check

      - name: Air-gapped local archive installation and compilation test
        shell: powershell
        run: |
          $asset = Get-ChildItem "$env:RUNNER_TEMP\dist\portable-haskell-*.zip" | Select-Object -First 1
          $testRoot = Join-Path $env:RUNNER_TEMP "offline-installer-e2e"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          Push-Location $testRoot
          try {
            & "$env:GITHUB_WORKSPACE\init.ps1" -Archive $asset.FullName -Checksum "$($asset.FullName).sha256" -InstallName offline
            $root = Join-Path $testRoot "OCR-portable-haskell-offline"
            & powershell -NoProfile -ExecutionPolicy Bypass -File "$root\Enter-PortableHaskell.ps1" -Check
            if ($LASTEXITCODE -ne 0) { throw "Offline launcher self-check failed." }
            & "$root\ghc\bin\ghc.exe" "$root\examples\hello\Main.hs" -o "$testRoot\hello.exe"
            if ($LASTEXITCODE -ne 0 -or ((& "$testRoot\hello.exe").Trim() -ne "Hello from portable Haskell!")) {
              throw "Offline Hello World test failed."
            }
          } finally { Pop-Location }

      - name: Publish organization-hosted assets
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: toolchain
          name: Portable Haskell toolchain
          body: |
            Windows x86-64 portable Haskell toolchain built from GHCup-verified upstream binaries.

            Every ZIP has a matching SHA-256 file. The installer refuses unverified archives.
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.sha256
            ${{ runner.temp }}/dist/*.json

      - name: End-to-end test the public one-line installer
        shell: powershell
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "public-installer-e2e"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          Push-Location $testRoot
          try {
            $asset = (Get-ChildItem "$env:RUNNER_TEMP\dist\portable-haskell-*.zip" | Select-Object -First 1).Name
            $env:ONE_CLICK_RUN_PORTABLE_HASKELL_SELECTED_ASSET = $asset
            $env:ONE_CLICK_RUN_PORTABLE_HASKELL_INSTALL_NAME = "e2e"
            $installer = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/init.ps1"
            Invoke-RestMethod $installer | Invoke-Expression

            $portableRoot = Join-Path $testRoot "OCR-portable-haskell-e2e"
            $enter = Join-Path $portableRoot "Enter-PortableHaskell.ps1"
            & powershell -NoProfile -ExecutionPolicy Bypass -File $enter -Check
            if ($LASTEXITCODE -ne 0) { throw "Public installation self-check failed." }

            $main = Join-Path $portableRoot "examples\hello\Main.hs"
            $hello = Join-Path $testRoot "hello.exe"
            & (Join-Path $portableRoot "ghc\bin\ghc.exe") $main -o $hello
            if ($LASTEXITCODE -ne 0) { throw "Hello World compilation failed." }
            $output = (& $hello).Trim()
            if ($output -ne "Hello from portable Haskell!") {
              throw "Unexpected Hello World output: $output"
            }
          } finally {
            Pop-Location
          }

